name: obol
version: 0.1.0
description: "Forecasts when Hermes will run out of budget and acts first: alerts you, switches to a cheaper model, or stops at the limit. Learns your usage on install and forecasts on your machine with the bundled Cascade 4M model; Ephemeris optional."
author: TensorLink-AI
license: Apache-2.0
homepage: https://github.com/TensorLink-AI/hermes-obol
manifest_version: 1
requires_hermes: ">=0.22.7"
kind: standalone
tags: [budget, cost, tokens, forecasting, guard]
provides_tools:
  - obol_budget
provides_hooks:
  - post_api_request
  - post_auxiliary_call
  - pre_llm_call
  - pre_tool_call
  - api_request_error
  - transform_llm_output
provides_middleware:
  - llm_request
python_dependencies:
  - "numpy>=1.26,<3"
requires_env: []
config_schema:
  budget_usd:
    type: float
    default: 0
    label: "Budget (USD)"
    description: "How much Hermes may spend per period. 0 = no budget: Obol still shows your spend, what's usual and a suggested budget"
  period:
    type: str
    choices: [day, week, month]
    default: week
    label: "Budget period"
    description: "Calendar day, week (from Monday) or month, in local time"
  mode:
    type: str
    choices: [alert, save, stop]
    default: alert
    label: "When I'm about to run out"
    description: "alert: warn me · save: also switch to the cheaper model below · stop: also refuse new messages once the budget is used up"
  cheap_model:
    type: str
    default: ""
    label: "Cheaper model"
    description: "What save mode switches to, on the same provider (e.g. deepseek/deepseek-v4-flash on OpenRouter). Several, comma-separated, make a ladder"
  budgets:
    type: list
    default: []
    label: "Advanced · budgets per provider"
    description: "Separate budgets per API, each forecast on its own usage and price, e.g. [{provider: openrouter, usd: 10, period: week}]. /obol budget 10 week openrouter sets one"
  provider:
    type: str
    default: ""
    label: "Advanced · main budget counts one provider only"
    description: "e.g. openrouter; empty counts every provider"
  unusual_day_x:
    type: float
    default: 3
    label: "Advanced · unusual day alert (× usual)"
    description: "Tell you when today is on track for this many times your usual day; 0 turns it off"
  max_request_usd:
    type: float
    default: 0
    label: "Advanced · hold turns costing more than (USD)"
    description: "Hold a turn whose input alone would cost more than this until you /obol allow it; 0 turns it off"
  rules:
    type: list
    default: []
    label: "Advanced · your own rules"
    description: "Replace the mode with your own rules, e.g. [{when: {state: over}, do: notify}]. See the README and /obol rules"
  forecaster:
    type: str
    choices: [auto, cascade, ephemeris, seasonal]
    default: auto
    label: "Advanced · forecaster"
    description: "auto: Cascade 4M on this machine, or Ephemeris once you save a key"
  ephemeris_api_key:
    type: secret
    env: EPHEMERIS_API_KEY
    label: "Advanced · Ephemeris API key (optional)"
    description: "Larger hosted forecasting models, a paid service by TensorLink (the makers of Obol). https://ephemeris.cascade.industries/sign-up"
  ephemeris_model:
    type: str
    default: toto2-313m
    label: "Advanced · Ephemeris model"
    description: "Model for Ephemeris forecasts, or 'route' to let Ephemeris pick"
  prices:
    type: dict
    default: {}
    label: "Advanced · your own prices"
    description: "$ per million tokens, {model: [input, output, cache_read]}; wins over the OpenRouter price list"
